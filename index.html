<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1"
    />
    <title>SmartBook</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: sans-serif;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
      .wrapper {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        min-height: 100dvh;
        background: #191919;
      }
      .wrapper header,
      .wrapper footer,
      .wrapper main {
        position: relative;
        z-index: 2;
      }
      .container {
        max-width: 390px;
        width: 100%;
        margin: 0 auto;
        padding: 0 15px;
      }
      @media (max-height: 827px) {
        .container {
          padding: 0 18px;
        }
      }

      .header {
        padding-top: 10px;
        padding-bottom: 20px;
      }
      .header__container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        position: relative;
      }
      .header__name {
        font-weight: 700;
        color: #cecece;
      }
      .header__danger {
        color: #cecece;
      }
      .header__logo {
        max-width: 142px;
      }
      @media screen and (orientation: landscape) and (max-height: 500px) {
        .header__logo {
          position: absolute;
          left: 5%;
        }
      }

      .footer__container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        margin-bottom: 10px;
      }
      .footer-link {
        color: #ffffff60;
        font-size: 12px;
        text-decoration: underline;
      }

      .main {
        flex: 1 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .main .bg {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: start;
        gap: 1rem;
        width: 100%;
      }
      @media (max-height: 600px) {
        .main .bg {
          gap: 0.5rem;
        }
      }
      .main .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 1rem 0;
      }
      @media (max-height: 600px) {
        .main .content {
          gap: 0.5rem;
          padding: 0.5rem 0;
        }
      }

      .btn-box {
        width: 100%;
        margin: 0 auto;
      }
      .foo {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 150px;
        padding: 1rem 1.5rem;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #00b09b, #96c93d);
        background-size: 200% 200%;
        color: #ffffff;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 176, 155, 0.4);
        transition: all 0.3s ease;
        animation: gradientShift 3s ease infinite;
        text-transform: uppercase;
      }
      .foo:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 35px rgba(0, 176, 155, 0.5);
      }
      .foo:active {
        transform: scale(0.95);
        box-shadow: 0 5px 15px rgba(0, 176, 155, 0.6);
      }
      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .description {
        color: #ffffff;
        opacity: 0.4;
        text-align: center;
        font-size: 10px;
        font-style: normal;
        font-weight: 300;
        line-height: 1.4;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="container header__container">
          <div class="header__name">SmartBook</div>
          <div class="header__danger">18+</div>
        </div>
      </header>
      <main class="main">
        <div class="bg">
          <div class="container">
            <div class="content">
              <div class="btn-box">
                <button class="foo">Читать</button>
              </div>
              <p class="description">
                Подключите подписку и экономьте время на поиск книг и деньги на их покупку, ведь мы
                уже подобрали для вас книги по различным темам, и все они предоставляются по одной
                подписке.<br />
                <span class="price">70 ₸ /день</span>
              </p>
            </div>
          </div>
        </div>
      </main>
      <footer class="footer">
        <div class="container footer__container">
          <a href="#" class="footer-link">Пользовательское соглашение</a>
          <a href="#" class="footer-link">Обратная связь</a>
        </div>
      </footer>
    </div>
  </body>
</html>
