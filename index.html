<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1"
    />
    <title>Астро-Портал</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: sans-serif;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
      .wrapper {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        min-height: 100dvh;
        background: #191919;
      }
      .wrapper header,
      .wrapper footer,
      .wrapper main {
        position: relative;
        z-index: 2;
      }
      .container {
        max-width: 390px;
        width: 100%;
        margin: 0 auto;
        padding: 0 15px;
      }
      @media (max-height: 827px) {
        .container {
          padding: 0 18px;
        }
      }

      .header {
        padding-top: 10px;
        padding-bottom: 20px;
      }

      .header__container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        position: relative;
      }

      .header__danger {
        position: absolute;
        right: 20px;
        top: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
        color: #a4a4a473;
        font-weight: 600;
      }

      .header__name {
        position: absolute;
        left: 30px;
        top: 5px;
        display: flex;
        font-weight: 400;
        align-items: center;
        color: #a4a4a462;
      }

      .header__title {
        color: #a4a4a49c;
        font-weight: 700;
      }

      .footer__container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 10px;
      }
      .footer-link {
        color: #ffffff87;
        font-size: 14px;
        text-decoration: underline;
      }

      .main {
        flex: 1 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .main .bg {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: start;
        gap: 1rem;
        width: 100%;
      }
      @media (max-height: 600px) {
        .main .bg {
          gap: 0.5rem;
        }
      }
      .main .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 1rem 0;
      }
      @media (max-height: 600px) {
        .main .content {
          gap: 0.5rem;
          padding: 0.5rem 0;
        }
      }

      .btn-box {
        width: 100%;
        margin: 0 auto;
      }
      .foo {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 150px;
        padding: 1rem 1.5rem;
        border: none;
        border-radius: 100px;
        background: linear-gradient(135deg, #1e90ff, #0077be, #004c8c);
        background-size: 200% 200%;
        color: #ffffff;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(30, 144, 255, 0.4);
        transition: all 0.3s ease;
        animation: gradientShift 3s ease infinite;
      }
      .foo:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 35px rgba(30, 144, 255, 0.5);
      }
      .foo:active {
        transform: scale(0.95);
        box-shadow: 0 5px 15px rgba(30, 144, 255, 0.6);
      }
      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .description {
        opacity: 0.2;
        color: #ffffff;
        text-align: center;
        font-size: 10px;
        font-style: normal;
        font-weight: 400;
        line-height: normal;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="container header__container">
          <div class="header__name"><span class="header__title">Астро-</span>Портал</div>
          <div class="header__danger">18+</div>
        </div>
      </header>
      <main class="main">
        <div class="bg">
          <div class="container">
            <div class="content">
              <div class="btn-box"><button class="foo">Подключить</button></div>
              <p class="description">
                Узнайте, что приготовили вам звёзды. Подключите подписку всего за
                <span class="price">100 ₸ /день</span> и получайте ежедневные астро-прогнозы и
                персональные подсказки — ваш личный путеводитель по судьбе.
              </p>
            </div>
          </div>
        </div>
      </main>
      <footer class="footer">
        <div class="container footer__container">
          <a
            href="https://astro-portal.kz/api/staticFile?name=oferta.pdf&lang=RU"
            class="footer-link"
            >Пользовательское соглашение</a
          >
          <a
            href="https://astro-portal.kz/api/staticFile?name=politic.pdf&lang=RU"
            class="footer-link"
            >Политика конфиденциальности</a
          >
        </div>
      </footer>
    </div>
  </body>
</html>
